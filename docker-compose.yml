# Согласовано с Dockerfile: Ubuntu + EXPOSE/ENV TODO_PORT=7540, том для SQLite.

services:
  scheduler:
    build: .
    working_dir: /app
    ports:
      - "7540:7540"
    environment:
      TODO_PORT: "7540"
      TODO_DBFILE: /data/scheduler.db
      TODO_PASSWORD: "1234567!"
    volumes:
      - scheduler-data:/data

volumes:
  scheduler-data:
